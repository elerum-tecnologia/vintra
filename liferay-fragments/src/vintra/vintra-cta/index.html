<#--
  Vintra - Chamada para ação
  Card com o gradiente da marca, título, descrição e um botão.
-->
<section class="vt vt-cta">
	<div class="vt-container">
		<div class="vt-cta__card vt-gradient">
			<div aria-hidden="true" class="vt-cta__shine"></div>

			<div class="vt-cta__content">
				<h2 class="vt-cta__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Pronto para simplificar sua operação?</h2>

				<#if configuration.showDescription>
					<p class="vt-cta__description" data-lfr-editable-id="description" data-lfr-editable-type="text">Fale com nosso time e veja como a Vintra se encaixa no seu processo, sem compromisso.</p>
				</#if>

				<div class="vt-cta__actions">
					<a class="vt-btn vt-btn--white vt-btn--lg" data-lfr-editable-id="button" data-lfr-editable-type="link" href="/contato">Agendar uma demonstração</a>
				</div>
			</div>
		</div>
	</div>
</section>
